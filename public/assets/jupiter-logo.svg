<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="100%" fill="currentColor">
  <!-- Planet Circle & Atmospheric Bands -->
  <g transform="translate(20, 10)">
    <!-- Outer Planet Boundary -->
    <circle cx="130" cy="130" r="115" stroke="currentColor" stroke-width="18" fill="none" />
    
    <g clip-path="url(#planet-clip)">
      <!-- Band 1 (Top Wave) -->
      <path d="M 15 105 C 45 88, 75 92, 105 78 C 135 64, 175 75, 215 52 C 235 42, 245 35, 255 30" 
            stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none" />
      
      <!-- Band 2 (Upper-Mid Wave) -->
      <path d="M 15 142 C 45 125, 80 130, 115 115 C 150 100, 190 110, 245 78" 
            stroke="currentColor" stroke-width="16" stroke-linecap="round" fill="none" />
      
      <!-- Band 3 (Lower-Mid Wave) -->
      <path d="M 22 180 C 55 160, 95 165, 135 145 C 160 134, 185 138, 205 145" 
            stroke="currentColor" stroke-width="16" stroke-linecap="round" fill="none" />
      
      <!-- Band 4 & Great Red Spot / Cyclone Swirl -->
      <path d="M 40 215 C 70 195, 110 195, 145 178 C 165 168, 185 160, 202 172 C 220 185, 212 215, 188 220 C 168 224, 155 205, 168 188 C 178 175, 198 180, 198 195" 
            stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none" />
      
      <!-- Band 5 (Bottom Curve) -->
      <path d="M 68 245 C 95 230, 130 225, 170 248" 
            stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none" />
    </g>
    
    <defs>
      <clipPath id="planet-clip">
        <circle cx="130" cy="130" r="106" />
      </clipPath>
    </defs>
  </g>

  <!-- Wordmark: JUPITER / ROASTERY in Authentic Bold Geometric Sans -->
  <g transform="translate(300, 20)">
    <!-- JUPITER -->
    <text x="0" y="105" 
          font-family="'Montserrat', 'Century Gothic', 'SF Pro Display', 'Inter', -apple-system, sans-serif" 
          font-size="112" 
          font-weight="900" 
          letter-spacing="5px" 
          fill="currentColor">JUPITER</text>
    
    <!-- ROASTERY -->
    <text x="0" y="215" 
          font-family="'Montserrat', 'Century Gothic', 'SF Pro Display', 'Inter', -apple-system, sans-serif" 
          font-size="94" 
          font-weight="900" 
          letter-spacing="11px" 
          fill="currentColor">ROASTERY</text>
  </g>
</svg>
